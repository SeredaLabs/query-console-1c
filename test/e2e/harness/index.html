<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Webview Harness</title>
  <link rel="stylesheet" href="codicon.css">
  <style>
    body { margin: 0; background: #1e1e1e; color: #ccc; height: 100vh; }
  </style>
</head>
<body>
  <div id="root" style="height:100vh;"></div>
  <script>
    // Capture all outgoing messages from the webview
    window.__webviewMessages = [];

    // Mock acquireVsCodeApi — must be defined BEFORE the bundle loads
    window.acquireVsCodeApi = function() {
      return {
        postMessage: function(msg) {
          window.__webviewMessages.push(msg);
          // Simulate host responses
          if (msg.type === 'ready') {
            setTimeout(function() {
              window.dispatchEvent(new MessageEvent('message', {
                data: { type: 'init', hasInitialQuery: false, queryTextEditorV2: false, locale: 'ru' }
              }));
              window.dispatchEvent(new MessageEvent('message', {
                data: {
                  type: 'metadataTree',
                  tables: [
                    {
                      kind: 'Справочник',
                      name: 'Валюты',
                      fullName: 'Справочник.Валюты',
                      fields: [
                        { name: 'Ссылка', kind: 'standard', types: [] },
                        { name: 'Код', kind: 'standard', types: [{ primitive: 'Строка' }] },
                        { name: 'Наименование', kind: 'standard', types: [{ primitive: 'Строка' }] },
                        { name: 'ЗагружаетсяИзИнтернета', kind: 'attribute', types: [{ primitive: 'Булево' }] }
                      ]
                    },
                    {
                      kind: 'Документ',
                      name: 'АвансовыйОтчет',
                      fullName: 'Документ.АвансовыйОтчет',
                      fields: [{ name: 'ВерсияДанных', kind: 'standard', types: [] }]
                    },
                    {
                      kind: 'Справочник',
                      name: 'Бригады',
                      fullName: 'Справочник.Бригады',
                      fields: [{ name: 'Ссылка', kind: 'standard', types: [] }]
                    },
                    {
                      kind: 'Справочник',
                      name: 'Банки',
                      fullName: 'Справочник.Банки',
                      fields: [{ name: 'Ссылка', kind: 'standard', types: [] }]
                    },
                    {
                      kind: 'Справочник',
                      name: 'АдресатыПисем',
                      fullName: 'Справочник.АдресатыПисем',
                      fields: [{ name: 'Ссылка', kind: 'standard', types: [] }]
                    }
                  ]
                }
              }));
            }, 50);
          }
        }
      };
    };
  </script>
  <script src="./main.js"></script>
</body>
</html>
