name: Release VSIX

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    # TEMPORARY: ubuntu-latest now also lands on Ubuntu 26.04, where Playwright 1.60
    # cannot install Chromium ("Playwright does not support chromium on
    # ubuntu26.04-x64"). Return to ubuntu-latest once Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - name: "Install Chromium (retries a flaky dl.google.com apt index)"
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Attempt $attempt failed, retrying in 20s..."
            sleep 20
          done
          exit 1
      - run: npm run test:e2e
      - name: Extension Host integration tests
        run: xvfb-run -a npm run test:integration

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # требуется для создания Release и загрузки asset
    # TEMPORARY: pinned together with verify (see above).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Package VSIX
        run: npx @vscode/vsce package --out query-console-1c-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: query-console-1c-*.vsix
          generate_release_notes: true
